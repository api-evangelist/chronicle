aid: chronicle
name: Chronicle
description: >-
  Chronicle is an AI presentation platform (chroniclehq.com) that turns documents, notes,
  data, and business context into beautiful, fully editable, on-brand presentations, using
  templates from designers at Apple, McKinsey, BCG, and IDEO. Beyond the web app, Chronicle
  ships a developer surface: a workspace-scoped REST API at api.chroniclehq.com/api/v1 for
  listing templates, creating and generating presentations, uploading reference files, and
  polling asynchronous generation jobs; and a hosted, OAuth-secured MCP server at
  mcp.chroniclehq.com that lets AI agents (Claude, ChatGPT, Gemini) create presentations
  directly. Chronicle is used by teams including OpenAI, Ramp, Vercel, Notion, Figma, and
  Meta, and is backed by Accel.
